server:
  port: 8088
  servlet:
    context-path: /

spring:
  application:
    name: john-sentinel-cc
  profiles:
    active: dev
    group:
      # 本地开发 + Nacos 动态规则
      dev-nacos:
        - dev
        - nacos
      # 生产 + Nacos 动态规则
      prod-nacos:
        - prod
        - nacos
      # Gateway + Nacos（Gateway 项目使用）
      gateway-nacos:
        - prod
        - nacos
        - nacos-gateway
      # 开发 + Nacos 规则 + Prometheus 监控
      dev-nacos-observability:
        - dev
        - nacos
        - prometheus
      # 生产完整栈：Nacos 规则 + Prometheus 监控
      prod-nacos-observability:
        - prod
        - nacos
        - prometheus

# 规则来源：local=代码+文件（默认）| nacos=Nacos 配置中心
sentinel:
  rules:
    source: local

# Sentinel 配置
spring.cloud.sentinel:
  # 是否启用 Sentinel
  enabled: true
  # 是否饥饿加载（提前初始化 Sentinel）
  eager: true
  # Transport 配置
  transport:
    # Sentinel Dashboard 地址
    dashboard: localhost:8080
    # 客户端监控 API 端口，默认 8719
    port: 8719
    # 心跳发送周期（毫秒）
    heartbeat-interval-ms: 10000
  # Web 配置
  web-context-unify: false
  # 日志配置
  log:
    dir: logs/sentinel
    switch-pid: true

# Actuator 监控端点配置
management:
  endpoints:
    web:
      exposure:
        include: '*'
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      simple:
        enabled: true

# 日志配置
logging:
  level:
    root: INFO
    com.john.sentinel: DEBUG
    com.alibaba.csp.sentinel: INFO
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n'
    file: '%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n'
  file:
    name: logs/application.log
    max-size: 100MB
    max-history: 30
